name: Fast CI

# Routine development feedback only: lint, typecheck, unit tests, and the production build.
#
# Everything heavier — PostgreSQL and migrations, the Playwright browser and device matrices,
# security and regression suites, backup/restore, dual Node runtimes, Windows, macOS, and UTC
# canonicalization — lives in `full-validation.yml` and runs when it is asked for. Nothing was
# deleted; a release candidate is still validated by dispatching the full suite against its
# exact SHA before validation is called complete.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Keyed on the branch rather than the commit, so pushing again supersedes the run already in
# flight instead of leaving both to finish. Full validation uses a separate, uncancellable group.
concurrency:
  group: fast-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  DOCUMENT_STORAGE_ADAPTER: memory
  TZ: America/Los_Angeles
  SESSION_SECRET: ci-session-secret-at-least-thirty-two-characters
  APP_ORIGIN: http://127.0.0.1:3000

jobs:
  fast-validation:
    name: Fast validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          # The classifier compares this push against its base, so it needs the history.
          fetch-depth: 0

      # The repository already owns one definition of "does this change affect the application",
      # in scripts/ci-change-classifier.mjs. It is reused here rather than restated as a
      # paths-ignore list so the two can never drift apart. Anything that is not purely
      # documentation is treated as executable and validated.
      - id: classify
        name: Classify change
        run: node scripts/classify-ci-change.mjs

      - uses: actions/setup-node@v6
        if: ${{ steps.classify.outputs.executable == 'true' && steps.classify.outputs.server == 'true' }}
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        if: ${{ steps.classify.outputs.executable == 'true' && steps.classify.outputs.server == 'true' }}
        run: npm ci

      - name: Confirm npm ci leaves the lockfile unchanged
        if: ${{ steps.classify.outputs.executable == 'true' && steps.classify.outputs.server == 'true' }}
        run: git diff --exit-code -- package-lock.json

      - name: Lint
        if: ${{ steps.classify.outputs.executable == 'true' && steps.classify.outputs.server == 'true' }}
        run: npm run lint

      - name: Typecheck
        if: ${{ steps.classify.outputs.executable == 'true' && steps.classify.outputs.server == 'true' }}
        run: npm run typecheck

      - name: Unit tests
        if: ${{ steps.classify.outputs.executable == 'true' && steps.classify.outputs.server == 'true' }}
        run: npm test

      - name: Build
        if: ${{ steps.classify.outputs.executable == 'true' && steps.classify.outputs.server == 'true' }}
        run: npm run build

      # The mobile app carries its own lockfile and is deliberately outside the root npm
      # workspace, so none of this installs unless the change actually touches it.
      - name: Install mobile dependencies
        if: ${{ steps.classify.outputs.executable == 'true' && steps.classify.outputs.mobile == 'true' }}
        run: npm ci --prefix apps/mobile

      - name: Mobile typecheck
        if: ${{ steps.classify.outputs.executable == 'true' && steps.classify.outputs.mobile == 'true' }}
        run: npx --prefix apps/mobile tsc -p apps/mobile/tsconfig.json --noEmit

      - name: Mobile tests
        if: ${{ steps.classify.outputs.executable == 'true' && steps.classify.outputs.mobile == 'true' }}
        run: npm test --prefix apps/mobile

      - name: Summarize
        env:
          EXECUTABLE: ${{ steps.classify.outputs.executable }}
          CHANGE_CLASS: ${{ steps.classify.outputs.change_class }}
          SERVER: ${{ steps.classify.outputs.server }}
          MOBILE: ${{ steps.classify.outputs.mobile }}
        run: |
          {
            echo "## Fast CI"
            echo
            echo "- Change class: \`$CHANGE_CLASS\`"
            if [ "$EXECUTABLE" = "true" ]; then
              echo "- Server validation: \`$SERVER\` (lint, typecheck, unit tests, build)."
              echo "- Mobile validation: \`$MOBILE\` (typecheck, tests)."
            else
              echo "- Documentation-only change: application validation was skipped."
            fi
            echo
            echo "Fast CI is not release validation. Dispatch **Full validation** against the"
            echo "exact release SHA before treating a candidate as validated."
          } >> "$GITHUB_STEP_SUMMARY"

name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pawsh
          POSTGRES_USER: pawsh
          POSTGRES_PASSWORD: pawsh-ci
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U pawsh -d pawsh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://pawsh:pawsh-ci@127.0.0.1:54322/pawsh
      SESSION_SECRET: ci-session-secret-at-least-thirty-two-characters
      APP_ORIGIN: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run validate
      - run: npm run test:db

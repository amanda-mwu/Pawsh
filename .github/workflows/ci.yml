name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_ENV: test
  DOCUMENT_STORAGE_ADAPTER: memory
  TZ: America/Los_Angeles
  SESSION_SECRET: ci-session-secret-at-least-thirty-two-characters
  APP_ORIGIN: http://127.0.0.1:3000
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers

jobs:
  static-validation:
    name: Static validation / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install --global npm@11.6.0
      - run: npm ci
      - name: Confirm npm ci leaves the lockfile unchanged
        run: git diff --exit-code -- package-lock.json
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend-runtime:
    name: Backend and PostgreSQL runtime / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pawsh
          POSTGRES_USER: pawsh
          POSTGRES_PASSWORD: pawsh-ci
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U pawsh -d pawsh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://pawsh:pawsh-ci@127.0.0.1:54322/pawsh
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install --global npm@11.6.0
      - run: npm ci
      - name: Confirm npm ci leaves the lockfile unchanged
        run: git diff --exit-code -- package-lock.json
      - run: npm run validate:runtime
      - name: Validate test-only memory storage safeguard
        shell: bash
        run: |
          set -euo pipefail
          NODE_ENV=test DOCUMENT_STORAGE_ADAPTER=memory PAWSH_E2E_MODE=disposable \
            node --import tsx --eval "const { loadConfig } = await import('./src/config.ts'); const { createDocumentStorage } = await import('./src/storage/documents.ts'); createDocumentStorage(loadConfig());"
          if NODE_ENV=development DOCUMENT_STORAGE_ADAPTER=memory \
            node --import tsx --eval "const { loadConfig } = await import('./src/config.ts'); const { createDocumentStorage } = await import('./src/storage/documents.ts'); createDocumentStorage(loadConfig());"; then
            echo "Development unexpectedly accepted memory document storage" >&2
            exit 1
          fi
      - name: Validate development startup
        shell: bash
        run: |
          set -euo pipefail
          NODE_ENV=development DOCUMENT_STORAGE_ADAPTER=filesystem \
            DOCUMENT_STORAGE_PATH=.pawsh-ci-documents APP_ORIGIN=http://127.0.0.1:3000 \
            DOCUMENT_SCANNER_ADAPTER=http DOCUMENT_SCANNER_ENDPOINT=http://127.0.0.1:9/scan \
            node --import tsx src/server.ts >development-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill -TERM "$SERVER_PID" 2>/dev/null || true; wait "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 100); do
            if curl --fail --silent http://127.0.0.1:3000/health >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat development-server.log
              exit 1
            fi
            sleep 0.1
          done
          cat development-server.log
          exit 1

  browser:
    name: Browser / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: chromium-smoke
            browser: chromium
            node: "24"
            command: npm run test:smoke
          - name: chromium-smoke-node22
            browser: chromium
            node: "22"
            command: npm run test:smoke
          - name: chromium-cross-browser
            browser: chromium
            node: "24"
            command: npx playwright test --project=chromium --grep @cross-browser
          - name: firefox-cross-browser
            browser: firefox
            node: "24"
            command: npx playwright test --project=firefox-desktop --grep @cross-browser
          - name: webkit-cross-browser
            browser: webkit
            node: "24"
            command: npx playwright test --project=webkit-desktop --grep @cross-browser
          - name: chromium-security
            browser: chromium
            node: "24"
            command: npx playwright test --project=chromium-security
          - name: chromium-regression
            browser: chromium
            node: "24"
            command: npx playwright test --project=chromium-regression
          - name: iphone-security
            browser: webkit
            node: "24"
            command: npx playwright test --project=iphone-security
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pawsh
          POSTGRES_USER: pawsh
          POSTGRES_PASSWORD: pawsh-ci
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U pawsh -d pawsh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://pawsh:pawsh-ci@127.0.0.1:54322/pawsh
      PAWSH_E2E_MODE: disposable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Use supported npm on Node 22
        if: matrix.node == '22'
        run: npm install --global npm@11.6.0
      - run: npm ci
      - name: Migrate isolated browser database
        run: npm run db:migrate
      - name: Install Playwright ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}
      - name: Upload browser failure artifacts
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failures-${{ matrix.name }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  responsive:
    name: Responsive / ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: iphone-webkit
            browser: webkit
          - project: android-chromium
            browser: chromium
          - project: ipad-webkit
            browser: webkit
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pawsh
          POSTGRES_USER: pawsh
          POSTGRES_PASSWORD: pawsh-ci
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U pawsh -d pawsh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://pawsh:pawsh-ci@127.0.0.1:54322/pawsh
      PAWSH_E2E_MODE: disposable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Record Playwright version
        run: npx playwright --version
      - name: Migrate isolated responsive database
        run: npm run db:migrate
      - name: Install Playwright ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Verify ${{ matrix.project }} mapping
        run: npx playwright test --project=${{ matrix.project }} --list
      - name: Run ${{ matrix.project }}
        run: npx playwright test --project=${{ matrix.project }}
      - name: Upload responsive failure artifacts
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failures-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  p1-document-scanning:
    name: Document Scanning / P1 Asynchronous Security QA
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pawsh_p1
          POSTGRES_USER: pawsh
          POSTGRES_PASSWORD: pawsh-ci
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U pawsh -d pawsh_p1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: development
      DATABASE_URL: postgres://pawsh:pawsh-ci@127.0.0.1:54322/pawsh_p1
      PAWSH_E2E_MODE: disposable
      PAWSH_E2E_BASE_URL: http://127.0.0.1:3301
      APP_ORIGIN: http://127.0.0.1:3301
      PORT: "3301"
      DOCUMENT_STORAGE_ADAPTER: filesystem
      DOCUMENT_STORAGE_PATH: .pawsh-p1-storage
      DOCUMENT_SCANNER_ADAPTER: http
      DOCUMENT_SCANNER_TOKEN: p1-scan-${{ github.run_id }}-${{ github.run_attempt }}
      PAWSH_P1_SCANNER_TOKEN: p1-scan-${{ github.run_id }}-${{ github.run_attempt }}
      PAWSH_P1_SCANNER_CONTROL_SECRET: p1-control-${{ github.run_id }}-${{ github.run_attempt }}
      PAWSH_P1_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
      PAWSH_P1_SCENARIO_ID: p1-pending-reload-v1
      DOCUMENT_SCANNER_ENDPOINT: http://127.0.0.1:4319/scan?run=gha-${{ github.run_id }}-${{ github.run_attempt }}&scenario=p1-pending-reload-v1
      SESSION_SECRET: p1-ci-session-secret-at-least-thirty-two-characters
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run qa:p1:fixtures
      - run: npx playwright install --with-deps chromium
      - name: Verify isolated P1 mapping
        run: npx playwright test --config=playwright.p1.config.ts --project=p1-document-scanning-chromium --list
      - name: Run P1 asynchronous scanner path
        shell: bash
        run: |
          set -euo pipefail
          npm run qa:p1:scanner:serve >p1-scanner.log 2>&1 &
          SCANNER_PID=$!
          npm run start:e2e >p1-app.log 2>&1 &
          APP_PID=$!
          cleanup() {
            kill -TERM "$APP_PID" "$SCANNER_PID" 2>/dev/null || true
            wait "$APP_PID" 2>/dev/null || true
            wait "$SCANNER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 100); do
            if curl --fail --silent http://127.0.0.1:3301/health >/dev/null; then break; fi
            if ! kill -0 "$APP_PID" 2>/dev/null || ! kill -0 "$SCANNER_PID" 2>/dev/null; then
              cat p1-app.log p1-scanner.log
              exit 1
            fi
            sleep 0.1
          done
          curl --fail --silent http://127.0.0.1:3301/health >/dev/null
          npm run qa:p1:test
          npm run qa:p1:evidence
      - name: Upload sanitized P1 evidence
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: p1-document-scanning-${{ github.sha }}
          path: |
            artifacts/p1/
            playwright-report/p1/
            test-results/p1/
            p1-app.log
            p1-scanner.log
          if-no-files-found: ignore
          retention-days: 7

  backup-restore:
    name: Backup and restore
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pawsh
          POSTGRES_USER: pawsh
          POSTGRES_PASSWORD: pawsh-ci
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U pawsh -d pawsh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://pawsh:pawsh-ci@127.0.0.1:54322/pawsh
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - name: Backup and restore rehearsal
        shell: bash
        run: |
          set -euo pipefail
          POSTGRES_CONTAINER="$(docker ps --filter ancestor=postgres:17-alpine --format '{{.ID}}' | head -n 1)"
          test -n "$POSTGRES_CONTAINER"
          docker exec "$POSTGRES_CONTAINER" pg_dump -U pawsh -d pawsh -Fc -f /tmp/pawsh.dump
          docker exec "$POSTGRES_CONTAINER" createdb -U pawsh pawsh_restore
          docker exec "$POSTGRES_CONTAINER" pg_restore -U pawsh -d pawsh_restore /tmp/pawsh.dump
          SOURCE_DATABASE_URL=postgres://pawsh:pawsh-ci@127.0.0.1:54322/pawsh \
            DATABASE_URL=postgres://pawsh:pawsh-ci@127.0.0.1:54322/pawsh_restore \
            npm run db:verify-restore

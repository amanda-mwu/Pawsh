name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pawsh
          POSTGRES_USER: pawsh
          POSTGRES_PASSWORD: pawsh-ci
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U pawsh -d pawsh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://pawsh:pawsh-ci@127.0.0.1:54322/pawsh
      SESSION_SECRET: ci-session-secret-at-least-thirty-two-characters
      APP_ORIGIN: http://127.0.0.1:3000
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run validate:ci
      - name: Install Chromium for GUI smoke
        run: npx playwright install --with-deps chromium
      - name: Auth lifecycle stability (50 consecutive executions)
        run: npx playwright test tests/e2e/smoke/auth-business.spec.ts --project=chromium --grep "auth session lifecycle" --repeat-each=50
        env:
          NODE_ENV: test
      - name: Browser GUI and security smoke
        run: npm run test:smoke
        env:
          NODE_ENV: test
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
      - name: Backup and restore rehearsal
        shell: bash
        run: |
          set -euo pipefail
          POSTGRES_CONTAINER="$(docker ps --filter ancestor=postgres:17-alpine --format '{{.ID}}' | head -n 1)"
          test -n "$POSTGRES_CONTAINER"
          docker exec "$POSTGRES_CONTAINER" pg_dump -U pawsh -d pawsh -Fc -f /tmp/pawsh.dump
          docker exec "$POSTGRES_CONTAINER" createdb -U pawsh pawsh_restore
          docker exec "$POSTGRES_CONTAINER" pg_restore -U pawsh -d pawsh_restore /tmp/pawsh.dump
          SOURCE_DATABASE_URL=postgres://pawsh:pawsh-ci@127.0.0.1:54322/pawsh \
            DATABASE_URL=postgres://pawsh:pawsh-ci@127.0.0.1:54322/pawsh_restore \
            npm run db:verify-restore

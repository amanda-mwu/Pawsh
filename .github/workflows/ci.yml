name: CI
on:
  pull_request:
  push:
    branches: [main]

env:
  NODE_ENV: test
  DOCUMENT_STORAGE_ADAPTER: memory
  TZ: America/Los_Angeles
  SESSION_SECRET: ci-session-secret-at-least-thirty-two-characters
  APP_ORIGIN: http://127.0.0.1:3000
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers

jobs:
  static-validation:
    name: Static validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend-runtime:
    name: Backend and PostgreSQL runtime
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pawsh
          POSTGRES_USER: pawsh
          POSTGRES_PASSWORD: pawsh-ci
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U pawsh -d pawsh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://pawsh:pawsh-ci@127.0.0.1:54322/pawsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run validate:runtime

  browser:
    name: Browser / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: chromium-smoke
            browser: chromium
            command: npm run test:smoke
          - name: chromium-cross-browser
            browser: chromium
            command: npx playwright test --project=chromium-desktop --grep @cross-browser
          - name: firefox-cross-browser
            browser: firefox
            command: npx playwright test --project=firefox-desktop --grep @cross-browser
          - name: webkit-cross-browser
            browser: webkit
            command: npx playwright test --project=webkit-desktop --grep @cross-browser
          - name: chromium-security
            browser: chromium
            command: npx playwright test --project=chromium-security
          - name: chromium-regression
            browser: chromium
            command: npx playwright test --project=chromium-regression
          - name: iphone-security
            browser: webkit
            command: npx playwright test --project=iphone-security
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pawsh
          POSTGRES_USER: pawsh
          POSTGRES_PASSWORD: pawsh-ci
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U pawsh -d pawsh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://pawsh:pawsh-ci@127.0.0.1:54322/pawsh
      PAWSH_E2E_MODE: disposable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Migrate isolated browser database
        run: npm run db:migrate
      - name: Install Playwright ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures-${{ matrix.name }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  responsive:
    name: Responsive / ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: iphone-webkit
            browser: webkit
          - project: android-chromium
            browser: chromium
          - project: ipad-webkit
            browser: webkit
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pawsh
          POSTGRES_USER: pawsh
          POSTGRES_PASSWORD: pawsh-ci
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U pawsh -d pawsh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://pawsh:pawsh-ci@127.0.0.1:54322/pawsh
      PAWSH_E2E_MODE: disposable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Record Playwright version
        run: npx playwright --version
      - name: Migrate isolated responsive database
        run: npm run db:migrate
      - name: Install Playwright ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Verify ${{ matrix.project }} mapping
        run: npx playwright test --project=${{ matrix.project }} --list
      - name: Run ${{ matrix.project }}
        run: npx playwright test --project=${{ matrix.project }}
      - name: Upload responsive failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  backup-restore:
    name: Backup and restore
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pawsh
          POSTGRES_USER: pawsh
          POSTGRES_PASSWORD: pawsh-ci
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U pawsh -d pawsh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://pawsh:pawsh-ci@127.0.0.1:54322/pawsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - name: Backup and restore rehearsal
        shell: bash
        run: |
          set -euo pipefail
          POSTGRES_CONTAINER="$(docker ps --filter ancestor=postgres:17-alpine --format '{{.ID}}' | head -n 1)"
          test -n "$POSTGRES_CONTAINER"
          docker exec "$POSTGRES_CONTAINER" pg_dump -U pawsh -d pawsh -Fc -f /tmp/pawsh.dump
          docker exec "$POSTGRES_CONTAINER" createdb -U pawsh pawsh_restore
          docker exec "$POSTGRES_CONTAINER" pg_restore -U pawsh -d pawsh_restore /tmp/pawsh.dump
          SOURCE_DATABASE_URL=postgres://pawsh:pawsh-ci@127.0.0.1:54322/pawsh \
            DATABASE_URL=postgres://pawsh:pawsh-ci@127.0.0.1:54322/pawsh_restore \
            npm run db:verify-restore

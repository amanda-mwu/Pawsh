name: Weekly runtime diagnostics

on:
  # No cron during active pre-live development: unattended runs only produce noise while the
  # repository changes daily. Dependency and runtime drift is still checked on demand through
  # workflow_dispatch, and a schedule can be restored when Pawsh reaches staging readiness.
  workflow_dispatch:

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm install --global npm@11.6.0
      - run: npm ci
      - name: Record outdated dependencies
        run: npm outdated --json > npm-outdated.json || test "$?" -eq 1
      - uses: actions/upload-artifact@v7
        if: ${{ always() && !cancelled() }}
        with:
          name: weekly-npm-outdated
          path: npm-outdated.json
          if-no-files-found: warn
          retention-days: 7

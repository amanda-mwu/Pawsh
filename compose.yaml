services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pawsh
      POSTGRES_USER: pawsh
      POSTGRES_PASSWORD: pawsh-local-only
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    command: ["postgres", "-c", "timezone=UTC"]
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pawsh -d pawsh"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pawsh-postgres:/var/lib/postgresql/data

volumes:
  pawsh-postgres:
